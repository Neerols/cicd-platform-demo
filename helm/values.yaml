replicaCount: 1

image:
  repository: registry.example.com/cicd-platform-demo
  tag: latest
  pullPolicy: IfNotPresent

appVersion: "dev"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  host: cicd-platform-demo.local
  path: /

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

probes:
  livenessPath: /health
  readinessPath: /health
