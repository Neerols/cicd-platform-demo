apiVersion: v1
kind: Service
metadata:
  name: {{ include "cicd-platform-demo.fullname" . }}
  labels:
    {{- include "cicd-platform-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "cicd-platform-demo.labels" . | nindent 4 }}
